# Deploys the ERP to the environment matching the branch: main -> production,
# develop -> development (once the DEVELOPMENT_ENABLED repository variable is
# "true"). Only the applications whose folder changed are deployed, in order:
# api, then web, then admin. One run per branch at a time, so deploys never
# compete for the host and none are dropped.
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    if: github.ref_name == 'main' || vars.DEVELOPMENT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Detect changed applications
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api: ["api/**", ".github/workflows/deploy.yml"]
            web: ["web/**", ".github/workflows/deploy.yml"]
            admin: ["admin/**", ".github/workflows/deploy.yml"]

  api:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }} (api)
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_PATH: ${{ vars.API_APP_PATH }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # This IS the production build (not just a validation gate): the
      # target server is too resource-constrained (tight disk quota, slow
      # CPU, drops long SSH sessions) to reliably `npm ci`+`nest build`
      # itself — see git history for what that cost us (17-minute installs,
      # quota exhaustion, connections dropped mid-build). Compiling here
      # means the server only ever needs a lean --omit=dev install to run
      # the already-built dist/, not the full webpack/@nestjs-cli toolchain.
      - name: Build production dist/
        run: npm run build

      - name: Package artifact
        run: tar czf ../api-deploy.tar.gz dist package.json package-lock.json prisma/schema.prisma deploy.sh

      - name: Ship to server (replace app files only, leave cPanel config alone)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This must exactly match cPanel's actual document root for this
          # subdomain (a fixed, separate setting from Node.js Selector's own
          # "app-root" bookkeeping -- the two are NOT the same thing, learned
          # the hard way: see git history). Verify via `uapi DomainInfo
          # domains_data` if this subdomain is ever recreated.
          APP_DIR="/home/$SSH_USER/$APP_PATH"
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"

          # Remove only what the packaged artifact replaces, NOT the whole
          # directory: a blind `rm -rf "$APP_DIR"` here once wiped .htaccess
          # (the Passenger routing config cPanel writes into this exact
          # directory, not somewhere separate) along with everything else,
          # silently turning every deploy into a 500 until someone noticed
          # and manually recreated the Node app registration. .env,
          # cgi-bin, php.ini, .user.ini, .well-known are all left alone.
          #
          # Deliberately NOT node_modules here: the still-running old
          # Passenger process has files under it open (e.g. deep in
          # firebase-admin/google-gax's dependency tree), and this host's
          # NFS-backed home directory silly-renames a file deleted while
          # still open instead of actually removing it -- so a plain
          # `rm -rf` here intermittently died with "Directory not empty"
          # (confirmed: killed an otherwise-good deploy of the very commit
          # that fixed the launch script). `npm ci` in deploy.sh already
          # deletes and rebuilds node_modules from scratch on every run --
          # doing it a second time here, earlier, only adds a race with no
          # benefit, so leave it for npm ci to handle once the old process
          # is closer to being replaced.
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/dist' '$APP_DIR/package.json' '$APP_DIR/package-lock.json' '$APP_DIR/prisma' '$APP_DIR/deploy.sh'"
          cat ../api-deploy.tar.gz | $SSH "$SSH_USER@$SSH_HOST" "tar xzf - -C '$APP_DIR' && echo EXTRACTED"

      - name: Install prod deps + restart on server (detached, polled)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 -o ConnectionAttempts=3 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
          # This must exactly match cPanel's actual document root for this
          # subdomain (a fixed, separate setting from Node.js Selector's own
          # "app-root" bookkeeping -- the two are NOT the same thing, learned
          # the hard way: see git history). Verify via `uapi DomainInfo
          # domains_data` if this subdomain is ever recreated.
          APP_DIR="/home/$SSH_USER/$APP_PATH"

          # This host regularly drops SSH sessions ("client_loop: send
          # disconnect: Broken pipe") — not just long-lived ones during a
          # build, but even quick individual commands at random. The actual
          # install runs detached via nohup, decoupled from any one
          # connection's lifetime; we poll with short separate connections,
          # and — critically — a poll attempt that itself fails to connect
          # is treated as "try again", not as the deploy failing. Losing
          # that distinction is what silently turned a fine, still-running
          # server-side install into a failed GitHub Actions run before.
          # Kill any prior instance first, unconditionally, every attempt
          # (including the first): a "failed" launch can still have started
          # the remote command before the connection dropped on its way
          # back — only the LAUNCHED confirmation was lost, not the launch.
          # Retrying without killing any prior instance once produced two
          # concurrent `npm ci` processes fighting over the same tight
          # memory budget, and the LVE limiter killed both.
          #
          # This kills by PID (from a pidfile written at launch time), NOT
          # `pkill -f 'bash deploy.sh'` — that pattern is a literal
          # substring of THIS SCRIPT'S OWN command line (it appears later
          # in the very same remote command, inside the nohup invocation),
          # and pgrep/pkill only exempt their own PID from a -f match, not
          # ancestor shells — so it was killing the bash process running
          # this remote command itself, instantly and silently, before any
          # output could be produced. That was the actual cause of every
          # "empty output, exit 255" failure above.
          #
          # Absolute paths throughout, and the cd+launch done inside its own
          # `( ... & )` subshell: backgrounding a `cd && rm && nohup` chain
          # with a bare trailing `&` backgrounds the cd along with it, so
          # anything checked afterward in the *outer* command runs from
          # whatever directory the shell started in, not $APP_DIR — a
          # latent bug that could make the deploy.exit existence check
          # below look at the wrong place entirely.
          LAUNCH_OK=false
          for attempt in 1 2 3 4 5 6 7 8; do
            OUT=$($SSH "$SSH_USER@$SSH_HOST" "if [ -f '$APP_DIR/deploy.pid' ]; then kill -9 \$(cat '$APP_DIR/deploy.pid') 2>/dev/null; fi; rm -f '$APP_DIR/deploy.exit' '$APP_DIR/deploy.log' '$APP_DIR/deploy.pid'; ( cd '$APP_DIR' && nohup bash -c 'bash deploy.sh > deploy.log 2>&1; echo \$? > deploy.exit' >/dev/null 2>&1 & echo \$! > '$APP_DIR/deploy.pid' ); disown; sleep 1; if [ ! -f '$APP_DIR/deploy.exit' ]; then echo LAUNCH_VERIFIED; else echo 'VERIFY_FAILED: deploy.exit reappeared immediately'; fi" 2>&1) || true
            echo "$OUT"
            if echo "$OUT" | grep -q LAUNCH_VERIFIED; then
              LAUNCH_OK=true
              break
            fi
            echo "Launch attempt $attempt did not verify, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          # Do NOT fall through to polling on an unverified launch: the
          # previous version of this script did exactly that once, and the
          # poll loop happily read a stale deploy.exit left over from an
          # entirely different, hours-old run, reporting a false result.
          if [ "$LAUNCH_OK" != "true" ]; then
            echo "Could not verify a fresh launch after 8 attempts — treating this as a real failure rather than guessing from stale files."
            exit 1
          fi

          echo "Prod install launched on the server, polling for completion..."
          for i in $(seq 1 120); do
            sleep 10
            RESULT=$($SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/deploy.exit' 2>/dev/null" || true)
            if [ -n "$RESULT" ]; then
              echo "--- remote install log ---"
              $SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/deploy.log'" || true
              echo "--- exit code: $RESULT ---"
              exit "$RESULT"
            fi
            echo "still running or poll connection blipped (~$((i * 10))s elapsed)..."
          done
          echo "Timed out after 20 minutes waiting for the server install to finish"
          $SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/deploy.log'" || true
          exit 1

  web:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }} (web)
    needs: [changes, api]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_PATH: ${{ vars.WEB_APP_PATH }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # This IS the production build (not just a validation gate): the
      # target server is too resource-constrained (tight disk quota, slow
      # CPU, drops long SSH sessions) to reliably `npm ci`+build itself —
      # see git history for what that cost us. Building here, on the
      # runner's real resources, and shipping only the finished
      # self-contained `.next/standalone` output (its own minimal
      # node_modules, no devDependencies needed on the server at all)
      # sidesteps every one of those constraints at once.
      - name: Build production standalone output
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WEB_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Package artifact
        run: |
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          tar czf ../web-deploy.tar.gz -C .next/standalone .

      - name: Ship to server and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This must exactly match cPanel's actual document root for this
          # subdomain (a fixed, separate setting from Node.js Selector's own
          # "app-root" bookkeeping — the two are NOT the same thing, learned
          # the hard way: see git history). Verify via `uapi DomainInfo
          # domains_data` if this subdomain is ever recreated.
          APP_DIR="/home/$SSH_USER/$APP_PATH"

          # Remove only what the standalone artifact replaces, NOT the whole
          # directory: `rm -rf "$APP_DIR"` here once wiped .htaccess (the
          # Passenger routing config cPanel writes into this exact
          # directory, not somewhere separate) along with everything else,
          # silently turning every deploy into a 500 until someone noticed
          # and manually recreated the Node app registration. cgi-bin,
          # php.ini, .user.ini, .well-known, and tmp/ are cPanel-managed —
          # leave them alone too.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/.next' '$APP_DIR/node_modules' '$APP_DIR/server.js' '$APP_DIR/package.json'"

          cat ../web-deploy.tar.gz | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "tar xzf - -C '$APP_DIR' && mkdir -p '$APP_DIR/tmp' && date > '$APP_DIR/tmp/restart.txt' && echo DEPLOYED"

  admin:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }} (admin)
    needs: [changes, web]
    if: ${{ !failure() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_PATH: ${{ vars.ADMIN_APP_PATH }}
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # This IS the production build (not just a validation gate): the
      # target server is too resource-constrained (tight disk quota, slow
      # CPU, drops long SSH sessions) to reliably `npm ci`+build itself —
      # see git history for what that cost us. Building here, on the
      # runner's real resources, and shipping only the finished
      # self-contained `.next/standalone` output (its own minimal
      # node_modules, no devDependencies needed on the server at all)
      # sidesteps every one of those constraints at once.
      - name: Build production standalone output
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.ADMIN_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Package artifact
        run: |
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          tar czf ../admin-deploy.tar.gz -C .next/standalone .

      - name: Ship to server and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This must exactly match cPanel's actual document root for this
          # subdomain (a fixed, separate setting from Node.js Selector's own
          # "app-root" bookkeeping — the two are NOT the same thing, learned
          # the hard way: see git history). Verify via `uapi DomainInfo
          # domains_data` if this subdomain is ever recreated.
          APP_DIR="/home/$SSH_USER/$APP_PATH"

          # Remove only what the standalone artifact replaces, NOT the whole
          # directory: `rm -rf "$APP_DIR"` here once wiped .htaccess (the
          # Passenger routing config cPanel writes into this exact
          # directory, not somewhere separate) along with everything else,
          # silently turning every deploy into a 500 until someone noticed
          # and manually recreated the Node app registration. cgi-bin,
          # php.ini, .user.ini, .well-known, and tmp/ are cPanel-managed —
          # leave them alone too.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/.next' '$APP_DIR/node_modules' '$APP_DIR/server.js' '$APP_DIR/package.json'"

          cat ../admin-deploy.tar.gz | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "tar xzf - -C '$APP_DIR' && mkdir -p '$APP_DIR/tmp' && date > '$APP_DIR/tmp/restart.txt' && echo DEPLOYED"
