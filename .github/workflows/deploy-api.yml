name: Deploy api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Shared across all three deploy-*.yml workflows: this shared cPanel host's
# resource limiter (CloudLinux LVE) kills concurrent npm ci/build processes
# under contention — SIGKILL, not a normal failure — when web/admin/api
# deploys land close together. Serializing across the whole group (not just
# this workflow) is what actually prevents that, not just self-concurrency.
concurrency:
  group: sttps-erp-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      # npm ci also runs `postinstall: prisma generate` (see package.json) —
      # `prisma` lives in dependencies, not devDependencies, specifically so
      # this still works on the server with --omit=dev (§6 of DEPLOYMENT.md).
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (validation gate — the real build runs on the server)
        run: npm run build

      - name: Deploy over SSH (git pull + build on the server)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # A heredoc passed via stdin to a remote `bash -s`, with the
          # variable given as a positional arg, avoids the quoting hazards
          # of building one giant interpolated string for `ssh host "..."`.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash -s -- "${REPO_DIR}-api" <<'REMOTE'
          set -e
          # Each app has its OWN clone (not a shared one) specifically so
          # concurrent web/admin/api deploys can never race on the same
          # .git ref locks.
          APP_DIR="$1"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          cd api
          source "$HOME/nodevenv/$(basename "$APP_DIR")/22/bin/activate"
          # Full install, not --omit=dev: `nest build` itself lives in the
          # @nestjs/cli devDependency, so omitting dev deps breaks the build
          # step, not just the eventual runtime.
          npm ci
          npm run build
          mkdir -p tmp
          date > tmp/restart.txt
          REMOTE
