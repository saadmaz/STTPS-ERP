name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

# Shared across all three deploy-*.yml workflows: this shared cPanel host's
# resource limiter (CloudLinux LVE) kills concurrent npm ci/build processes
# under contention — SIGKILL, not a normal failure — when web/admin/api
# deploys land close together. Serializing across the whole group (not just
# this workflow) is what actually prevents that, not just self-concurrency.
concurrency:
  group: sttps-erp-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Build here is a validation gate only — it never touches the server.
      # The real production build runs on the server itself so NEXT_PUBLIC_*
      # values match whatever is actually configured there.
      - name: Build (validation gate)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.ADMIN_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy over SSH (git pull + build on the server)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
          ADMIN_NEXT_PUBLIC_API_URL: ${{ secrets.ADMIN_NEXT_PUBLIC_API_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash -s -- "${REPO_DIR}-admin" "$ADMIN_NEXT_PUBLIC_API_URL" <<'REMOTE'
          set -e
          # Each app has its OWN clone (not a shared one) specifically so
          # concurrent web/admin/api deploys can never race on the same
          # .git ref locks.
          APP_DIR="$1"
          export NEXT_PUBLIC_API_URL="$2"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          cd admin
          source "$HOME/nodevenv/$(basename "$APP_DIR")/22/bin/activate"
          # Full install, not --omit=dev: `next build` needs typescript,
          # tailwindcss/postcss/autoprefixer from devDependencies to run at
          # all, not just the eventual runtime.
          npm ci
          npm run build
          mkdir -p tmp
          date > tmp/restart.txt
          REMOTE
