name: Deploy admin

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-admin.yml"
  workflow_dispatch:

# Shared across all three deploy-*.yml workflows so they never hit this
# host's resources at the same time.
concurrency:
  group: sttps-erp-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # This IS the production build (not just a validation gate): the
      # target server is too resource-constrained (tight disk quota, slow
      # CPU, drops long SSH sessions) to reliably `npm ci`+build itself —
      # see git history for what that cost us. Building here, on the
      # runner's real resources, and shipping only the finished
      # self-contained `.next/standalone` output (its own minimal
      # node_modules, no devDependencies needed on the server at all)
      # sidesteps every one of those constraints at once.
      - name: Build production standalone output
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.ADMIN_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Package artifact
        run: |
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          tar czf ../admin-deploy.tar.gz -C .next/standalone .

      - name: Ship to server and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # This must exactly match cPanel's actual document root for this
          # subdomain (a fixed, separate setting from Node.js Selector's own
          # "app-root" bookkeeping — the two are NOT the same thing, learned
          # the hard way: see git history). Verify via `uapi DomainInfo
          # domains_data` if this subdomain is ever recreated.
          APP_DIR="/home/$SSH_USER/admin.erp.sttps.co"

          # Remove only what the standalone artifact replaces, NOT the whole
          # directory: `rm -rf "$APP_DIR"` here once wiped .htaccess (the
          # Passenger routing config cPanel writes into this exact
          # directory, not somewhere separate) along with everything else,
          # silently turning every deploy into a 500 until someone noticed
          # and manually recreated the Node app registration. cgi-bin,
          # php.ini, .user.ini, .well-known, and tmp/ are cPanel-managed —
          # leave them alone too.
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/.next' '$APP_DIR/node_modules' '$APP_DIR/server.js' '$APP_DIR/package.json'"

          cat ../admin-deploy.tar.gz | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "tar xzf - -C '$APP_DIR' && mkdir -p '$APP_DIR/tmp' && date > '$APP_DIR/tmp/restart.txt' && echo DEPLOYED"
