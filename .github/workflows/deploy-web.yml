name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Shared across all three deploy-*.yml workflows: this shared cPanel host's
# resource limiter (CloudLinux LVE) kills concurrent npm ci/build processes
# under contention — SIGKILL, not a normal failure — when web/admin/api
# deploys land close together. Serializing across the whole group (not just
# this workflow) is what actually prevents that, not just self-concurrency.
concurrency:
  group: sttps-erp-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Build here is a validation gate only — it never touches the server.
      # The real production build (below) runs on the server itself so
      # NEXT_PUBLIC_* values match whatever is actually configured there.
      - name: Build (validation gate)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WEB_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy over SSH (launch detached, poll for completion)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
          WEB_NEXT_PUBLIC_API_URL: ${{ secrets.WEB_NEXT_PUBLIC_API_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          APP_DIR="${REPO_DIR}-web"

          # This host regularly drops long-lived SSH sessions mid-build
          # ("client_loop: send disconnect: Broken pipe" after several
          # minutes) — a known issue on this same host, documented in a
          # sibling project too. The actual build (npm ci + next build,
          # which can take 10+ minutes here) runs detached on the server
          # via nohup, decoupled from this connection's lifetime; git
          # operations happen in this short launcher call, which is fast
          # enough to not be at risk. We then poll for completion with
          # separate short-lived connections instead of holding one open.
          $SSH "$SSH_USER@$SSH_HOST" bash -s -- "$APP_DIR" "$WEB_NEXT_PUBLIC_API_URL" <<'LAUNCH'
          set -e
          APP_DIR="$1"
          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          cd web
          rm -f deploy.exit deploy.log
          NEXT_PUBLIC_API_URL="$2" nohup bash -c 'bash deploy.sh > deploy.log 2>&1; echo $? > deploy.exit' >/dev/null 2>&1 &
          disown
          echo LAUNCHED
          LAUNCH

          echo "Build launched on the server, polling for completion (this host is slow, can take 10+ min)..."
          for i in $(seq 1 80); do
            sleep 15
            RESULT=$($SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/web/deploy.exit' 2>/dev/null || true")
            if [ -n "$RESULT" ]; then
              echo "--- remote build log ---"
              $SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/web/deploy.log'"
              echo "--- exit code: $RESULT ---"
              exit "$RESULT"
            fi
            echo "still running (~$((i * 15))s elapsed)..."
          done
          echo "Timed out after 20 minutes waiting for the server build to finish"
          $SSH "$SSH_USER@$SSH_HOST" "cat '$APP_DIR/web/deploy.log'" || true
          exit 1
