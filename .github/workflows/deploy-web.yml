name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Build here is a validation gate only — it never touches the server.
      # The real production build (§ below) runs on the server itself so
      # NEXT_PUBLIC_* values match whatever is actually configured there.
      - name: Build (validation gate)
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.WEB_NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy over SSH (git pull + build on the server)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          REPO_DIR: ${{ secrets.SERVER_REPO_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$REPO_DIR'
            git fetch origin main
            git reset --hard origin/main
            cd web
            source ~/nodevenv/*/22/bin/activate 2>/dev/null || true
            npm ci --omit=dev
            npm run build
            mkdir -p tmp
            date > tmp/restart.txt
          "
