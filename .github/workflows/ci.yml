# Continuous integration: the merge gate for every pull request into develop and main.
# Production deployment is handled separately (see docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Colombo

    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Set up Java for the Firestore emulator
        if: matrix.app == 'api'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Test
        if: matrix.app == 'api'
        run: npm test
